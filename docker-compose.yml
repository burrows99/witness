# The stack this repository describes.
#
# A typical full-stack app is not one service: it is a thing people use, the database it writes to,
# the mail it sends, and something watching all of it. Each of these is here because the description
# beside it needs a different half of the vocabulary — a UI with routes and locators, a REST API, real
# rows to query, a second UI on a second service.
#
#   docker compose up -d
#   npx witness stack status
#   npx witness action run tour
services:
  # The app: a git forge with a web UI, a REST API, and a database it actually writes to.
  gitea:
    image: gitea/gitea:1.21.11
    container_name: witness-gitea
    depends_on: [postgres, mailpit]
    ports:
      - "${GITEA_PORT:-3020}:3000"
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:${GITEA_PORT:-3020}/
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${POSTGRES_CREDENTIAL:-witness-demo-only}
      # The account the description registers through the UI. Gitea refuses anything under 8
      # characters, which the frame from the failing step said and nothing else would have.
      WITNESS_ACCOUNT_CREDENTIAL: ${GITEA_CREDENTIAL:-witness-demo-only}
      # So registering a user sends a real message a real mail catcher receives.
      GITEA__mailer__ENABLED: "true"
      GITEA__mailer__PROTOCOL: smtp
      GITEA__mailer__SMTP_ADDR: mailpit
      GITEA__mailer__SMTP_PORT: "1025"
      GITEA__mailer__FROM: gitea@witness.example

  # What it writes to. Real tables, real rows — the layer a screen can disagree with.
  postgres:
    image: postgres:17
    container_name: witness-postgres
    ports:
      - "${POSTGRES_PORT:-5441}:5432"
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${POSTGRES_CREDENTIAL:-witness-demo-only}

  # What it sends. A UI of its own and an API of its own — a second of each, which is the point.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: witness-mailpit
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # What watches it. Somebody else's software, described the same way as our own.
  grafana:
    image: grafana/grafana:13.2.0
    container_name: witness-grafana
    ports:
      - "${GRAFANA_PORT:-3010}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

  # --- Third-party OSS, deliberately not chosen for convenience -------------------------------
  # Six applications nobody here designed, picked so each one stresses a different part of reading a
  # description off a running system. A stack we built ourselves can only tell us what we already
  # assumed.

  # Server-rendered PHP with no JavaScript at all: a login form, and not one XHR to observe.
  adminer:
    image: adminer:4.8.1
    container_name: witness-adminer
    ports:
      - "${ADMINER_PORT:-8091}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  # A Vue single-page app behind a setup wizard: almost no server-rendered links to crawl.
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    container_name: witness-uptime-kuma
    ports:
      - "${KUMA_PORT:-3011}:3001"

  # An identity provider. The one thing the description language cannot express is a sign-in that
  # LEAVES the app, and this is that sign-in, on a second origin, on purpose.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: witness-keycloak
    command: ["start-dev", "--http-port=8080"]
    ports:
      - "${KEYCLOAK_PORT:-8092}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

  # API-first: the screens are a thin client over its own REST API, so exploring it should yield
  # operations rather than routes.
  directus:
    image: directus/directus:11.1.1
    container_name: witness-directus
    ports:
      - "${DIRECTUS_PORT:-8093}:8055"
    environment:
      KEY: witness-demo-only-key
      SECRET: witness-demo-only-secret
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: witness-demo-only
      DB_CLIENT: sqlite3
      DB_FILENAME: /directus/database/data.db

  # A SECOND database, so the multi-database case is in our own stack rather than only in somebody
  # else's. No container_name on purpose: compose names it, and something has to work that out.
  mariadb:
    image: mariadb:11.4
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    environment:
      MARIADB_DATABASE: witness
      MARIADB_USER: witness
      MARIADB_PASSWORD: ${MARIADB_CREDENTIAL:-witness-demo-only}
      MARIADB_ROOT_PASSWORD: ${MARIADB_CREDENTIAL:-witness-demo-only}

  # Not HTTP, and no container_name either: two ways a probe can be got wrong at once.
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
