# The Grafana this example describes.
#
# `witness` reads the SAME `.env` compose reads, so the port is decided once, here, and `stack status`
# compares the real publisher of that port against `container_name` — another project answering on 3010
# reads as NOT OURS rather than as a healthy Grafana.
#
#   docker compose up -d
#   npx witness stack status
#   npx witness action run grafana.theWholeProduct
services:
  grafana:
    image: grafana/grafana:13.2.0
    container_name: witness-example-grafana
    ports:
      - "${GRAFANA_PORT:-3010}:3000"
    environment:
      # The credentials the description resolves with `containerEnv` — read back out of the RUNNING
      # container rather than out of this file, because a container keeps the values it was created
      # with and the process serving requests is the one telling the truth.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # A fresh instance, every time: the example is about what a product looks like from nothing.
      GF_USERS_ALLOW_SIGN_UP: "false"
