name: Auto Release

# Every merge to main cuts a version: tests, build, a tag, a GitHub Release with generated notes, and
# the package on this repository's own npm registry. Releases surface in followers'
# feeds and notify watchers; the registry is what makes the README's install line true.
#
# Nothing here writes to main. The version is bumped in the checkout, read by `npm publish`, and
# thrown away with the runner. The tags are the record of what shipped, and the next version is
# computed from them.
#
# Put "[skip release]" in the commit SUBJECT (first line) to skip one.
on:
  push:
    branches: [main]

permissions:
  contents: write # push the tag, publish the release
  packages: write # publish to this repository's own npm registry

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Skip if the commit subject says so
        id: gate
        run: |
          subject="$(git log -1 --pretty=%s)"
          if printf '%s' "$subject" | grep -qiF '[skip release]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # No version pinned here: package.json's `packageManager` is the single
      # source of truth, and the action refuses when both name a version.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24
          # This repository's own registry: the packages belong to the repo that builds them, and the
          # workflow's own token is the only credential — nothing to create, rotate or leak. The
          # scope is the owning organisation, which is what a GitHub Packages namespace is.
          registry-url: https://npm.pkg.github.com
          scope: "@macquery-labs"

      - name: Install and build
        if: steps.gate.outputs.skip != 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The browser tiers need a real Chromium, exactly as ci.yml installs one.
      # Publishing without running them would mean shipping on a narrower proof
      # than a pull request has to clear.
      - name: Install Chromium and ffmpeg
        if: steps.gate.outputs.skip != 'true'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        if: steps.gate.outputs.skip != 'true'
        run: pnpm test

      # The last check before the tarball becomes someone else's problem: the
      # exports map resolves, and the declarations resolve with it. A release
      # is the only place this failing actually costs anything.
      - name: Check the package a consumer will receive
        if: steps.gate.outputs.skip != 'true'
        run: pnpm lint:package

      - name: Work out the next version and tag it
        if: steps.gate.outputs.skip != 'true'
        id: ver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Semantic Versioning 2.0.0 says a PATCH is for backward compatible bug fixes, a MINOR for
          # backward compatible additions and a MAJOR for breaks — and only a person knows which a
          # change was. So the default is the safe one, a patch past the newest tag, and raising the
          # version in package.json is how a pull request asks for more than that. Asked for, it is
          # released exactly as written: bumping to 0.2.0 must publish 0.2.0, not 0.2.1.
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          declared="$(node -p 'require("./package.json").version')"

          if [ -z "$latest" ]; then
            next="$declared"
          elif [ "$declared" != "${latest#v}" ] &&
            [ "$(printf '%s\n%s\n' "${latest#v}" "$declared" | sort -V | tail -n1)" = "$declared" ]; then
            next="$declared"
          else
            next="$(echo "${latest#v}" | awk -F. '{print $1"."$2"."$3 + 1}')"
          fi

          # One package now, so one version to set.
          npm version "$next" --no-git-tag-version --allow-same-version

          git tag -a "v$next" -m "Release v$next"
          git push origin "v$next"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment rather than interpolated into the script.
          # `${{ }}` is expanded by the runner before bash ever sees the line,
          # so an expression carrying a quote becomes shell rather than an
          # argument. These two are repo-controlled and the risk is remote —
          # but the safe spelling costs nothing and stops the pattern being
          # copied to a value that is not.
          TAG: ${{ steps.ver.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --generate-notes

      - name: Publish the packages
        if: steps.gate.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        # --no-git-checks because the working tree is deliberately dirty: the
        # version bump is never committed.
        run: pnpm publish --access public --no-git-checks
