name: Auto Release

# Every merge to main cuts a version: tests, build, a patch bump, a tag, a GitHub Release with
# generated notes, and the package on npm. Releases surface in followers' feeds and notify watchers;
# the registry is what makes the README's install line true.
#
# Put "[skip release]" in the commit SUBJECT (first line) to skip one. The version-bump commit this
# workflow pushes carries that marker itself, which is what stops it triggering itself.
on:
  push:
    branches: [main]

permissions:
  contents: write # tag, push the version bump, publish the release
  id-token: write # npm trusted publishing (OIDC) — no long-lived token to leak

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if the commit subject says so
        id: gate
        run: |
          subject="$(git log -1 --pretty=%s)"
          if printf '%s' "$subject" | grep -qiF '[skip release]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Node 24 for the npm that can do trusted publishing (11.5.1+); the package itself runs on 22.6+.
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install, test, build
        if: steps.gate.outputs.skip != 'true'
        run: |
          npm ci
          npm test
          npm run build

      - name: Bump the version and tag it
        if: steps.gate.outputs.skip != 'true'
        id: ver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The bump commit says [skip release] so this workflow does not trigger itself.
          version="$(npm version patch -m 'Release %s [skip release]')"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          git push --follow-tags

      - name: Publish the release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes

      # Trusted publishing signs each publish with a short-lived OIDC token and attaches provenance,
      # with nothing to steal from the repository. It has to be configured once on npmjs.com against
      # THIS workflow file, and a package that does not exist yet cannot be configured — so the first
      # publish uses a granular token in NPM_TOKEN, and the secret can be deleted afterwards.
      - name: Publish to npm
        if: steps.gate.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] && [ "$TRUSTED" != "true" ]; then
            echo "::warning::not published — set the NPM_TOKEN secret, or configure trusted publishing on npmjs.com and set the NPM_TRUSTED_PUBLISHING variable to true"
            exit 0
          fi
          npm publish --access public
