name: Auto Release

# Every merge to main cuts a version: tests, build, a patch bump, a tag, a GitHub Release with
# generated notes, and the package on this repository's npm registry. Releases surface in followers'
# feeds and notify watchers; the registry is what makes the README's install line true.
#
# Put "[skip release]" in the commit SUBJECT (first line) to skip one. The version-bump commit this
# workflow pushes carries that marker itself, which is what stops it triggering itself.
on:
  push:
    branches: [main]

permissions:
  contents: write # tag, push the version bump, publish the release
  packages: write # publish to this repository's own npm registry

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip if the commit subject says so
        id: gate
        run: |
          subject="$(git log -1 --pretty=%s)"
          if printf '%s' "$subject" | grep -qiF '[skip release]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 24
          # This repository's own registry: the package belongs to the repo that builds it, and the
          # workflow's own token is the only credential — nothing to create, rotate or leak.
          registry-url: https://npm.pkg.github.com
          scope: "@burrows99"

      - name: Install, test, build
        if: steps.gate.outputs.skip != 'true'
        run: |
          npm ci
          npm test
          npm run build

      - name: Bump the version and tag it
        if: steps.gate.outputs.skip != 'true'
        id: ver
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The tags are the record of what has shipped, and package.json can be behind them — an
          # earlier workflow that tagged without bumping leaves `npm version patch` colliding with a
          # tag that already exists. So the next version is computed from whichever is higher, and
          # written once: a catch-up bump followed by a patch bump leaves the tree dirty, and
          # `npm version` refuses to run on a dirty tree.
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          current="$(node -p 'require("./package.json").version')"
          base="$(printf '%s\n%s\n' "${latest#v}" "$current" | sort -V | tail -n1)"
          next="$(echo "$base" | awk -F. '{print $1"."$2"."$3 + 1}')"

          # The bump commit says [skip release] so this workflow does not trigger itself.
          version="$(npm version "$next" -m 'Release %s [skip release]')"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          git push --follow-tags

      - name: Publish the release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes

      - name: Publish the package
        if: steps.gate.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish
