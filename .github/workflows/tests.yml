name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Playwright is an optional peer: the suite skips its browser half when it is absent, and CI is
      # the one place nothing should be skipped.
      - run: npm ci
      - run: npm install --no-save @playwright/test@^1
      # The package is not the browser. Installing @playwright/test downloads no browsers at all —
      # checked against a scratch prefix rather than against this machine, which had one and had got
      # it some other way. Without this line the test that drives `check drift` the way the CLI drives
      # it skips here — which is the failure it exists to catch, arriving in the place that matters
      # most — and so does the one that reads a real DOM, whose defect lives in a CSS selector and so
      # cannot be reached by any fixture.
      - run: npx playwright install --with-deps chromium

      # The types, including the TESTS — `tsconfig.build.json` excludes them because they do not ship,
      # and for a long time that meant nothing checked them at all.
      - run: npm run typecheck

      # What the type checker cannot say: a promise nobody awaited, an export nothing reaches.
      - run: npm run lint
      - run: npm run deadcode

      - run: node --test --disable-warning=MODULE_TYPELESS_PACKAGE_JSON "src/**/*.test.ts" "bin/**/*.test.ts"

      - name: the template must still describe the schema
        run: bin/witness config template > /dev/null

      # What consumers get: the exports map, the files list, the types beside them.
      - run: npm run build
      - run: npx publint --strict
