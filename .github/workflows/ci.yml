name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Nothing in this file pushes, publishes or comments, and
# a pull_request build runs fixture code, a browser and three language runtimes
# — none of which should be holding a token that can write to the repository.
# release.yml asks for write, in the one job that needs it.
permissions:
  contents: read

jobs:
  # The tiers run in the order the design puts them in: cheap logic first,
  # then adapters, then real apps, then the mutation harness that proves the
  # gate would have caught anything at all.
  static:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Type-checks the build graph, then everything the build excludes —
      # tests included, which is where two vacuous assertions were hiding.
      - run: pnpm typecheck
      - run: pnpm typecheck:all
      - run: pnpm lint
      # Unused exports, files and dependencies. Now that there is one manifest,
      # this is how a phantom dependency gets noticed.
      - run: pnpm knip
      - name: audit dependencies
        run: pnpm audit --audit-level=high

      # What a consumer actually receives. `tsc` proves the sources type-check;
      # it says nothing about whether the exports map resolves, and that map is
      # the part a release can silently break — as the collapse to one package
      # nearly did. publint reads the packed tarball, attw resolves every entry
      # point the way a consumer's TypeScript would.
      - run: pnpm build
      - run: pnpm lint:package

      # The workflows are code too, and they run with a token. actionlint is
      # correctness (expressions, shell, action inputs); zizmor is the security
      # audit — template injection, credential persistence, overbroad
      # permissions, unpinned actions.
      # `go install` rather than the upstream download-and-run script: the
      # module proxy and checksum database verify what arrives, and a workflow
      # that pipes a URL into a shell to audit workflows for supply-chain risk
      # would be arguing against itself.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: stable, cache: false }
      - name: lint workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - name: audit workflows
        run: pipx run zizmor==1.29.0 --persona=regular .github/workflows/

  unit:
    name: L0 unit + architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:l0
      - run: pnpm test:arch

  adapters:
    name: L1 adapter contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: 'stable' }
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv && .venv/bin/pip install debugpy
      - run: go install github.com/go-delve/delve/cmd/dlv@latest
      # Warm the Go build cache, so delve is not compiling the standard library
      # inside the first probe's launch window.
      - run: go build ./...
        working-directory: fixtures/l1/go
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:l1

  fleet:
    name: L2 conformance + L3 mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv && .venv/bin/pip install debugpy
      - run: npx playwright install --with-deps chromium
      # The recording tier transcodes to H.264 and then proves it did. Without
      # these the run degrades to a raw webm and the proof cannot run at all,
      # so CI would never check the one artefact a reviewer actually opens.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm test:l2
      # M1 and M2 are published from this job's log every run (PRD §6).
      - run: pnpm test:l3

  dogfood:
    name: L4 — witness gates its own change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:l4
      # The generated skill describes this project's plans, adapters and
      # policies. Steering that nobody enforces drifts, so its freshness is
      # checked where the gate is: in CI.
      - run: node dist/cli/bin.js skill --check
