name: codeql

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly: a dependency that was clean on merge does not stay clean.
    - cron: '17 4 * * 1'

jobs:
  analyze:
    name: analyze javascript-typescript
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          languages: javascript-typescript
          # Nothing is generated at build time, so CodeQL can read the sources
          # directly rather than watching a build.
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          category: /language:javascript-typescript
